[package]
name = "cora-battle"
version = "0.1.0"
description = "Ephemeral Rollup program for CORA Battle"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cora_battle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.1"
anchor-spl = "1.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
